<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nacionalidade</title>
    <style>
        html, body{
            height: 100%;
            margin: 0;
            text-align: center;
        }
        body{
            background-image: linear-gradient(to bottom , #364651,#0000,#777);}
    </style>
</head>
<body>
    <h1>Verificando Nacionalidade</h1>
    
    <input type="text" id="txtpais" placeholder="Digite seu país">
    <input type="button" value="Verificar" onclick="verificar()">

    <div id="res">Resultado</div>

   <script>
    function verificar() {
        // 1. CRIAMOS O "CAMPO" (O GARÇOM)
        var campo = document.getElementById('txtpais'); 
        
        // 2. PEGAMOS O VALOR DO CAMPO
        var pais = campo.value.trim().toLowerCase();
        
        var res = document.getElementById('res');

        // Lógica de verificação
        if (pais === 'brasil') {
            res.innerHTML = `Você é <strong>Brasileiro</strong>!`;
            res.style.color = 'green';
        } else {
            res.innerHTML = `Você é <strong>Estrangeiro</strong>!`;
            res.style.color = 'red';
        }

        // 3. USAMOS O "CAMPO" PARA LIMPAR E DAR FOCO
        campo.value = ''; // Limpa a caixa
        campo.focus();    // Deixa o cursor piscando lá
    }
</script>
</body>
</html>
