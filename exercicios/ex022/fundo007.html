<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhando caixas</title>
    <style>
        #container{
            position: relative;
            height: 80vh;
            padding: 10px;
            background: purple url(imagens/target001.png);
            background-size: 100% 100%;
        }
        #conteudo{
            position: absolute;
            height: 200px;
            width: 400px;
            background: yellow url(imagens/target001.png);
            background-size: 100% 100%;

            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <h1>Centralização vertical de caixas</h1>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
