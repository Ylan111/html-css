<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeira aula de Js</title>
    <style>
        body {
            background-color: rgb(19, 59, 73);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        div#area {
            background-color: rgb(43, 141, 4);
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;

        }
    </style>

</head>

<body>
    <h1>Inicando estudo DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>aprendendo a usar <strong>DOM</strong> em JavaScript.</p>
    <div id="area" onclick= "clicar()" onmouseenter="entrar()" onmouseout="sair()">Interaja...</div>
    <script>
        var a = document.getElementById('area')
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)
        function clicar() {
            a.innerText = 'Clicou!!!'
            a.style.background = 'red'
        }
        function entrar() {
            a.innerText = 'Entrou!!'
            a.style.background = 'purple'
        }
        function sair() {
            a.innerText = "Saiu!!"
            a.style.background = 'blue'
        }
    </script>
</body>

</html>
