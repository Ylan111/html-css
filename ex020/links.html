<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* 

        # = id
        . = class
        : = pseudo-classe
        :: = pseudo elemente
        > = clildren

        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        a:active{
            color: yellow;
        }
        .unica{
            background-color: rgb(255, 169, 169);
        }
        a{
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        .unica::after{
            content: ' ♕ ' ;
            color: black;
        }
        .unica::before{
            content: ' ♛ ';
            color: black;            
        }
        
    </style>
</head>
<body>
    <h1>Personalisando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.git.io" target="_blank" class="unica">Repositorio Github</a></li>
        
        <li><a href="https://www.youtube.com/" target="_blank">Canal do YouTube</a></li>
       
        <li><a href="https://www.cursoemvideo.com/"target="_blank">Site do Curso em Video</a></li>
    </ul>
</body>
</html>
